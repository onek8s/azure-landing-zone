# The API server's own Service, as AKS keeps it in `default`: HTTPS to the control plane, never routed by a
# gateway - exempt by name.
apiVersion: v1
kind: Service
metadata:
  labels:
    component: apiserver
    provider: kubernetes
  name: kubernetes
  namespace: default
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  type: ClusterIP
