# notification-controller's receiver Service as the Flux extension installs it: GitHub's webhooks are
# HTTP/1.1 and so is the route to it (design D78) - exempt by name.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: notification-controller
    control-plane: controller
  name: webhook-receiver
  namespace: flux-system
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http-webhook
  selector:
    app: notification-controller
  type: ClusterIP
