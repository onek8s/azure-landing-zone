affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - preference:
        matchExpressions:
        - key: kubernetes.azure.com/scalesetpriority
          operator: In
          values:
          - spot
      weight: 50
nodeSelector:
  kubernetes.io/arch: amd64
  platform/zone: ext-fi
tolerations:
- effect: NoSchedule
  key: platform/capacity
  operator: Equal
  value: spot
- effect: NoSchedule
  key: kubernetes.azure.com/scalesetpriority
  operator: Equal
  value: spot
- effect: NoSchedule
  key: platform/zone
  operator: Equal
  value: ext-fi
