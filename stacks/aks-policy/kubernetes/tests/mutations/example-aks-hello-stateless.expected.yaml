affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - preference:
        matchExpressions:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
          - spot
      weight: 50
    - preference:
        matchExpressions:
        - key: kubernetes.azure.com/scalesetpriority
          operator: In
          values:
          - spot
      weight: 50
nodeSelector:
  kubernetes.azure.com/mode: system
  kubernetes.io/arch: amd64
tolerations:
- key: CriticalAddonsOnly
  operator: Exists
- effect: NoSchedule
  key: platform/capacity
  operator: Equal
  value: spot
- effect: NoSchedule
  key: kubernetes.azure.com/scalesetpriority
  operator: Equal
  value: spot
