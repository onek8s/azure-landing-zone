# The parameters stacks/aks-policy assigns (kubernetes.tf).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformAppEgress
metadata:
  name: app-egress
spec:
  match:
    kinds:
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumNetworkPolicy
    - apiGroups:
      - networking.k8s.io
      kinds:
      - NetworkPolicy
    - apiGroups:
      - ''
      kinds:
      - Pod
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - azure-arc
    - azure-extensions-usage-system
    - flux-system
    - kube-public
    - aks-istio-system
    - kube-node-lease
    - external-secrets
    - external-dns
    - platform-gateway
    - infra-observability
    - '*-gateway'
    - '*-secrets'
