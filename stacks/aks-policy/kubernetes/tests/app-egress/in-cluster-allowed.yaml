apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: in-cluster
  namespace: ext-fi-app
spec:
  endpointSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        app: db
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - toServices:
    - k8sService:
        serviceName: api
        namespace: ext-fi-app
