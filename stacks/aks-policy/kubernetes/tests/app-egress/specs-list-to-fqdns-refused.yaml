apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress
  namespace: ext-fi-app
specs:
- endpointSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        app: db
- endpointSelector: {}
  egress:
  - toFQDNs:
    - matchName: login.microsoftonline.com
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
