# Service accounts of application pods (R10, R11, design sections 2.5 and 2.7):
#
#   - no application pod runs as the namespace's `key-vault` service account: that is the identity
#     External Secrets Operator reads the namespace's share of the vault as, and a pod running as it
#     could read the vault itself;
#   - no `imagePullSecrets`, on a pod or a ServiceAccount: images come from the environment's
#     registry, pulled by the kubelet's identity (AcrPull), never with a credential in the cluster.
#
# That a pod's own service account carries the workload identity client ID cannot be checked here:
# a custom Azure Policy definition sees only the object under review, not the ServiceAccount it
# names (no data replication).
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8splatformserviceaccounts
  annotations:
    description: Application pods do not run as the vault reader's service account and use no image pull secrets.
spec:
  crd:
    spec:
      names:
        kind: K8sPlatformServiceAccounts
      validation:
        openAPIV3Schema:
          type: object
          properties:
            readerServiceAccount:
              type: string
              description: The service account a namespace reads its vault share as (no pod may run as it).
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8splatformserviceaccounts

        obj := input.review.object

        violation[{"msg": msg}] {
          obj.kind == "Pod"
          object.get(obj.spec, "serviceAccountName", "default") == input.parameters.readerServiceAccount
          msg := sprintf("Pod %v runs as %v, the service account the namespace reads its Key Vault share as. Use a service account of its own; External Secrets Operator delivers the secrets.", [obj.metadata.name, input.parameters.readerServiceAccount])
        }

        violation[{"msg": msg}] {
          obj.kind == "Pod"
          count(object.get(obj.spec, "imagePullSecrets", [])) > 0
          msg := sprintf("Pod %v has imagePullSecrets; images are pulled from the environment's registry by the kubelet's identity.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          obj.kind == "ServiceAccount"
          count(object.get(obj, "imagePullSecrets", [])) > 0
          msg := sprintf("ServiceAccount %v has imagePullSecrets; images are pulled from the environment's registry by the kubelet's identity.", [obj.metadata.name])
        }
