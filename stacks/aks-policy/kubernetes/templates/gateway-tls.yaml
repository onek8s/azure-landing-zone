# The zone gateways' TLS (design section 4.1, decisions D70 and D71): HTTP/2 only (ALPN `h2` alone) and
# TLS 1.3 only, the same on every gateway. Traefik takes both from its default TLS options, which
# aks-terraform's gateways/traefik renders as a file-provider ConfigMap `traefik-dynamic` in the gateway's
# namespace. This template reads that ConfigMap back and refuses one that offers anything else, so the
# setting cannot drift away from the platform's rule in a gateway namespace. App Routing's Istio exposes
# neither setting (no EnvoyFilter, nothing on its allow list), which is why Traefik serves every
# environment until it does.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8splatformgatewaytls
  annotations:
    description: The gateways' default TLS options offer only the allowed ALPN protocols and TLS versions.
spec:
  crd:
    spec:
      names:
        kind: K8sPlatformGatewayTls
      validation:
        openAPIV3Schema:
          type: object
          properties:
            configMapName:
              type: string
              description: The gateway's dynamic-configuration ConfigMap (traefik-dynamic).
            dataKey:
              type: string
              description: The ConfigMap key holding the Traefik dynamic configuration (dynamic.yaml).
            alpnProtocols:
              type: array
              description: The ALPN protocol list the default TLS options must offer, exactly (h2).
              items:
                type: string
            minVersion:
              type: string
              description: The minimum TLS version the default TLS options must state (VersionTLS13).
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8splatformgatewaytls

        obj := input.review.object

        is_gateway_config {
          obj.kind == "ConfigMap"
          obj.metadata.name == input.parameters.configMapName
        }

        dynamic := yaml.unmarshal(object.get(object.get(obj, "data", {}), input.parameters.dataKey, "{}"))

        default_options := object.get(object.get(dynamic, "tls", {}), "options", {})["default"]

        violation[{"msg": msg}] {
          is_gateway_config
          not object.get(object.get(dynamic, "tls", {}), "options", {})["default"]
          msg := sprintf("ConfigMap %v: %v has no tls.options.default - the gateway must offer ALPN %v and TLS %v only (design D70, D71).", [obj.metadata.name, input.parameters.dataKey, input.parameters.alpnProtocols, input.parameters.minVersion])
        }

        violation[{"msg": msg}] {
          is_gateway_config
          object.get(default_options, "alpnProtocols", []) != input.parameters.alpnProtocols
          msg := sprintf("ConfigMap %v: tls.options.default.alpnProtocols is %v, must be exactly %v - HTTP/2 only at the edge (design D70).", [obj.metadata.name, object.get(default_options, "alpnProtocols", []), input.parameters.alpnProtocols])
        }

        violation[{"msg": msg}] {
          is_gateway_config
          object.get(default_options, "minVersion", "") != input.parameters.minVersion
          msg := sprintf("ConfigMap %v: tls.options.default.minVersion is %v, must be %v - TLS 1.3 only at the edge (design D71).", [obj.metadata.name, object.get(default_options, "minVersion", "(unset)"), input.parameters.minVersion])
        }
