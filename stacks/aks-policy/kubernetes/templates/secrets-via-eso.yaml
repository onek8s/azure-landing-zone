# Secrets only through External Secrets Operator (R11, design section 2.5): in an isolation zone's
# namespaces - its applications' `<zone>-<app>` and its gateway's `<zone>-gateway` - a Secret may be
# created or changed only by that zone's External Secrets Operator, the service account
# `system:serviceaccount:<zone>-secrets:external-secrets-<zone>` (aks-fluxcd-platform,
# infrastructure/zones/external-secrets.yaml). A team cannot put a Secret there itself, with Flux,
# kubectl or a pipeline, so every secret an application gets came from its share of a vault.
#
#   - The zone's `<zone>-secrets` namespace is the operator's own (its Helm release is stored there)
#     and is left out by the assignment.
#   - Helm release Secrets (type helm.sh/release.v1) are allowed: Helm's storage, not a secret.
#   - Deleting is not checked: it hands nothing to a pod.
#   - `exemptUsers` may write them too: what AKS itself keeps in an application namespace (the Flux
#     extension's `<configuration>-auth`, `-genkey` and `-protected-parameters` of the team's Flux
#     configuration).
#
# The rule reads the admission request's user, which Gatekeeper's background audit does not have:
# the audit therefore reports nothing, and only admission refuses. aks-terraform's Cluster status
# lists who wrote each Secret of the zones' namespaces, to check before the rule denies.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8splatformsecretsviaeso
  annotations:
    description: In an isolation zone's namespaces only the zone's External Secrets Operator writes Secrets.
spec:
  crd:
    spec:
      names:
        kind: K8sPlatformSecretsViaEso
      validation:
        openAPIV3Schema:
          type: object
          properties:
            zones:
              type: array
              description: The isolation zones; the namespaces <zone>-* are theirs.
              items:
                type: string
            exemptUsers:
              type: array
              description: Request users (service accounts of AKS components) that may write Secrets too.
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8splatformsecretsviaeso

        secret := input.review.object {
          input.review.object.kind == "Secret"
        }

        zone := z {
          z := input.parameters.zones[_]
          startswith(secret.metadata.namespace, sprintf("%v-", [z]))
        }

        controller := sprintf("system:serviceaccount:%v-secrets:external-secrets-%v", [zone, zone])

        violation[{"msg": msg}] {
          zone
          secret.metadata.namespace != sprintf("%v-secrets", [zone])
          object.get(secret, "type", "Opaque") != "helm.sh/release.v1"
          input.review.operation != "DELETE"
          user := object.get(object.get(input.review, "userInfo", {}), "username", "")
          user != ""
          user != controller
          not exempt(user)
          msg := sprintf("Secret %v/%v: in zone %v only its External Secrets Operator (%v) writes Secrets, not %v. Put the secret in the namespace's share of the zone's Key Vault and sync it with an ExternalSecret.", [secret.metadata.namespace, secret.metadata.name, zone, controller, user])
        }

        exempt(user) {
          user == object.get(input.parameters, "exemptUsers", [])[_]
        }
